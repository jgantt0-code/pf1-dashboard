<title>Pfizer Football League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one scoreboard-style header, a tab strip, then dense scan-first tables and plain-CSS charts that sit in a single column of max 1080px. */
:root{
  --bg:#F2F5F1;          /* turf-tinted paper */
  --surface:#FFFFFF;
  --surface-2:#E8EEE7;
  --ink:#16221C;
  --ink-2:#4A5A51;
  --ink-3:#6F7F76;
  --line:#D3DCD2;
  --accent:#1E6B49;      /* field green */
  --heat:#5FAE84;
  --pos:#2766A8;         /* luck: above expectation */
  --neg:#C25A1B;         /* luck: below expectation */
  --pos-tint:#2766A8;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --c-ink:#1F3A30;       /* cartoon outline */
  --c-w:#FFFFFF;
  --c1:#6FCFA0; --c2:#6BB6F2; --c3:#FFD35C; --c4:#FF8F8F; --c5:#D9955C;
  --pat-op:.34;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512;--surface:#16201B;--surface-2:#1D2924;--ink:#E6EEE9;--ink-2:#A6B5AC;--ink-3:#84948B;
    --line:#2A3832;--accent:#5FC08D;--heat:#2F7D58;--pos:#6AA6E2;--neg:#E58A4F;--c-ink:#A9E8C9;--c-w:#20332B;--c1:#2FA073;--c2:#3C86C9;--c3:#D9A93A;--c4:#D96A6A;--c5:#A8693A;--pat-op:.26;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#16201B;--surface-2:#1D2924;--ink:#E6EEE9;--ink-2:#A6B5AC;--ink-3:#84948B;
  --line:#2A3832;--accent:#5FC08D;--heat:#2F7D58;--pos:#6AA6E2;--neg:#E58A4F;--c-ink:#A9E8C9;--c-w:#20332B;--c1:#2FA073;--c2:#3C86C9;--c3:#D9A93A;--c4:#D96A6A;--c5:#A8693A;--pat-op:.26;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
/* cartoon wallpaper */
.needles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--pat-op)}
.needles .o{stroke:var(--c-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.needles .k{fill:var(--c-ink);stroke:none}
.needles .n{stroke:none}
.needles .f1{fill:var(--c1)}.needles .f2{fill:var(--c2)}.needles .f3{fill:var(--c3)}.needles .f4{fill:var(--c4)}.needles .f5{fill:var(--c5)}.needles .fw{fill:var(--c-w)}
@media (max-width:560px){.needles{opacity:calc(var(--pat-op)*.72)}}
.needles .sm{stroke:var(--c-ink);stroke-width:2.6;stroke-linecap:round;fill:none}
header{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.meta{color:var(--ink-2);font-size:14px;margin:0}
.meta b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;border-bottom:2px solid var(--ink);overflow-x:auto;scrollbar-width:none}
nav button{font:600 17px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:none;border:0;padding:12px 16px 11px;cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{padding-top:24px;display:flex;flex-direction:column;gap:36px}
.lede{font-size:17px;max-width:68ch;margin:0;text-wrap:pretty}
.lede b{font-weight:600}
h2{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 12px;max-width:72ch}
.block{min-width:0}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:600 12px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--ink)}
th.l,td.l{text-align:left}
td.team{white-space:normal;min-width:190px}
.team b{font-weight:600;display:block}
.team small{color:var(--ink-3);font-size:12px}
.rk{font:700 18px/1 var(--font-display);color:var(--ink-2);width:36px}
.dim{color:var(--ink-3)}
small.who2{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.h2h td.rowh small.who2{display:inline;margin-left:6px}
/* trophies */
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.yr .y{font:600 13px/1 var(--font-body);letter-spacing:.08em;color:var(--ink-3)}
.yr .c{font:700 22px/1.1 var(--font-display);margin-top:6px;text-transform:uppercase;overflow-wrap:anywhere}
.yr .p{color:var(--ink-2);font-size:13px}
.yr.empty .c{color:var(--ink-3);font-size:16px;text-transform:none;font-weight:600}
.yr.win{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.trophy td.f{text-align:center;min-width:74px;padding:7px 6px;line-height:1.15}
.trophy td.f b{font:700 20px/1 var(--font-display);display:block}
.trophy td.f small{font-size:11.5px;color:var(--ink-3)}
.trophy td.f.p1{background:var(--accent);color:var(--bg)}
.trophy td.f.p1 small{color:var(--bg);opacity:.85}
.trophy td.f.seed{color:var(--ink-3)}
.trophy td.f.p2{background:color-mix(in srgb,var(--heat) 42%,var(--surface))}
.trophy td.f.p3{background:color-mix(in srgb,var(--heat) 22%,var(--surface))}
.trophy td.f.none{color:var(--ink-3)}
.trophy td.tot{font:700 20px/1 var(--font-display);text-align:center}
/* rules */
.money{display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(0,.8fr) auto minmax(0,1.2fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 18px}
.m-label{font:600 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.bills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bill{aspect-ratio:2.1/1;border:2px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--heat) 38%,var(--surface));display:grid;place-items:center;position:relative;font:700 15px/1 var(--font-display);color:var(--ink)}
.bill::before{content:"";position:absolute;inset:4px;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:2px}
.m-cap{margin-top:8px;font-size:13px;color:var(--ink-2)}
.m-arrow{font:700 34px/1 var(--font-display);color:var(--accent)}
.potbox{border:3px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--heat) 30%,var(--surface));text-align:center;padding:18px 8px;font:700 clamp(38px,6vw,56px)/1 var(--font-display);letter-spacing:.02em}
.pays{display:flex;flex-direction:column;gap:10px}
.pay{border-radius:8px;padding:12px 14px;border:2px solid var(--accent);min-width:0}
.pay b{font:700 34px/1 var(--font-display);display:block}
.pay span{font-size:13px;color:var(--ink-2)}
.pay.first{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.pay.first span{color:var(--bg);opacity:.9}
.pay.second{background:color-mix(in srgb,var(--heat) 25%,var(--surface))}
.splitbar{display:flex;height:34px;margin-top:14px;border-radius:6px;overflow:hidden;font:600 13px/34px var(--font-body);gap:2px}
.splitbar i{font-style:normal;padding:0 10px;white-space:nowrap;overflow:hidden}
.splitbar .a{background:var(--accent);color:var(--bg)}
.splitbar .b{background:color-mix(in srgb,var(--heat) 45%,var(--surface));color:var(--ink);padding:0;text-align:center}
.punish{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--neg);border-radius:6px;padding:16px 18px}
.punish .tag{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--neg)}
.punish p{margin:8px 0 0;font-size:17px}
.punish p.sec{font-size:15px;color:var(--ink-2)}
.odds{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:0 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
.odds .row{display:contents}
.odds .nm{padding:7px 0;border-bottom:1px solid var(--line);font-weight:500}
.odds .tr{position:relative;height:100%;min-height:36px;border-bottom:1px solid var(--line)}
.odds .bar{position:absolute;left:0;top:10px;bottom:10px;background:var(--neg);border-radius:0 3px 3px 0;opacity:.85}
.odds .vl{text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding:7px 0;font-weight:600}
.odds .row:last-of-type>*{border-bottom:0}
.vid{aspect-ratio:16/9;max-width:100%;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--ink-2);padding:16px;overflow:hidden}
video.vid{padding:0;background:#000;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.card .ph{aspect-ratio:4/5;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);font-size:13px;text-align:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;cursor:zoom-in;min-height:0}
.card .ph.multi{grid-template-columns:1fr 1fr;grid-template-rows:1.35fr 1fr;gap:2px;place-items:stretch}
.card .ph.multi img:first-child{grid-column:1/3}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain}
#lb button{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:16px;font:600 15px var(--font-body);color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:8px 14px;cursor:pointer}
.card .cap{padding:10px 14px 12px}
.card .cap b{font:700 20px/1 var(--font-display);letter-spacing:.03em}
.card .cap small{display:block;color:var(--ink-2);font-size:13px;margin-top:4px}
.fmt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.fmt li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.fmt b{display:block;font:700 22px/1 var(--font-display)}
.fmt span{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){
  .money{grid-template-columns:1fr}
  .m-arrow{transform:rotate(90deg);justify-self:center}
}
.pill{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:var(--surface-2);color:var(--ink-2)}
.up{color:var(--pos)} .down{color:var(--neg)}
.barcell{position:relative;min-width:84px}
.barcell i{position:absolute;left:0;top:6px;bottom:6px;background:var(--heat);opacity:.35;border-radius:0 3px 3px 0}
.barcell span{position:relative}
/* luck chart */
.luck{display:grid;grid-template-columns:minmax(120px,210px) 1fr 120px;gap:0 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
.luck .row{display:contents}
.luck .nm{font-weight:500;padding:7px 0;border-bottom:1px solid var(--line)}
.luck .tr{position:relative;height:100%;min-height:36px;border-bottom:1px solid var(--line)}
.luck .tr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink-3)}
.luck .bar{position:absolute;top:10px;bottom:10px;border-radius:3px}
.luck .bar.p{background:var(--pos);left:50%}
.luck .bar.n{background:var(--neg);right:50%}
.luck .vl{font-variant-numeric:tabular-nums;text-align:right;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.luck .axis{grid-column:2;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);padding-top:6px}
.luck .row:last-of-type>*{border-bottom:0}
/* heat grid */
.heat td.c{text-align:center;min-width:58px;padding:8px 6px;background:color-mix(in srgb,var(--heat) calc(var(--i)*62%),var(--surface))}
.heat td.c.future{background:none;color:var(--ink-3)}
.heat tr.avg td{background:var(--surface-2);font-weight:600}
/* projection */
.proj{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:0 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
.proj .row{display:contents}
.proj .nm{padding:7px 0;border-bottom:1px solid var(--line);font-weight:500}
.proj .tr{position:relative;height:100%;min-height:36px;border-bottom:1px solid var(--line)}
.proj .tr::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.proj .band{position:absolute;top:13px;bottom:13px;background:var(--heat);opacity:.45;border-radius:4px}
.proj .dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.proj .now{position:absolute;top:8px;bottom:8px;width:2px;background:var(--ink)}
.proj .vl{text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding:7px 0}
.proj .axis{grid-column:2;position:relative;height:18px;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.proj .axis span{position:absolute;transform:translateX(-50%)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
/* h2h */
.h2h th.v{height:150px;vertical-align:bottom;padding:8px 4px;min-width:44px;text-align:center}
.h2h th.v span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
.h2h td{padding:0;text-align:center}
.h2h td.cell{min-width:44px;height:38px;font-size:12.5px;background:var(--surface)}
.h2h td.self{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--surface) 4px 8px)}
.h2h td.rowh{text-align:left;padding:8px 12px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line);font-weight:500;white-space:nowrap}
.h2h th.l{position:sticky;left:0;z-index:2}
/* ranks */
.ranks td.r{text-align:center;min-width:72px;padding:6px 6px;line-height:1.15;background:color-mix(in srgb,var(--heat) calc(var(--i)*62%),var(--surface))}
.ranks td.r b{font:700 20px/1 var(--font-display);display:block}
.ranks td.r small{font-size:11.5px;color:var(--ink-2)}
.ranks td.r.none{background:none;color:var(--ink-3)}
/* records */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:28px 24px}
.recs ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.recs li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.recs li:last-child{border-bottom:0}
.recs .when{font:600 12px/1 var(--font-body);letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.recs .who{min-width:0}
.recs .who small{display:block;color:var(--ink-3)}
.recs .num{font:700 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
/* nfl banner */
#nfl{margin:0 0 20px}
.nfl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 16px;margin-bottom:8px}
.nfl-head b{font:600 16px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.nfl-head span{font-size:12.5px;color:var(--ink-2)}
.nfl-strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
.g{flex:0 0 206px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.g .when{white-space:nowrap;display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.g .when em{font-style:normal;color:var(--ink-2)}
.g .tm{display:flex;justify-content:space-between;align-items:baseline;font:600 19px/1.25 var(--font-display);letter-spacing:.03em;color:var(--ink-2)}
.g .tm small{font:500 13.5px var(--font-body);font-variant-numeric:tabular-nums}
.g .tm.fav{color:var(--ink);font-weight:700}
.g .tm.fav small{color:var(--accent);font-weight:700}
.g .pb{display:flex;height:7px;gap:2px;margin-top:8px}
.g .pb i{display:block;border-radius:3px;background:var(--line)}
.g .pb i.f{background:var(--accent)}
.g .np{margin-top:8px;font-size:12px;color:var(--ink-3)}
.nfl-empty{font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:13px;max-width:78ch}
footer p{margin:0 0 8px}
@media (max-width:560px){
  .luck,.proj{grid-template-columns:96px 1fr 62px;gap:0 8px;padding:8px 10px;font-size:13px}
  th,td{padding:8px 8px}
  td.team{min-width:150px}
  .recs li{grid-template-columns:58px 1fr auto}
}
@media (prefers-reduced-motion:no-preference){.panel{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<svg class="needles" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

    <symbol id="syr" viewBox="0 0 160 40" overflow="visible">

      <path class="sm" d="M80 23 Q85 28.5 90 23"/>
      <path class="o fw" d="M120 14 L133 17 L133 23 L120 26 Z"/>

    </symbol>
    <symbol id="vial" viewBox="0 0 34 50" overflow="visible">
      <rect class="o f4" x="7" y="2" width="20" height="9" rx="3"/>
      <rect class="o fw" x="10" y="11" width="14" height="6"/>

/* ---------- sortable table helper ---------- */
const sortState={};
function sortedRows(id,rows,cols,def){
  const st=sortState[id]||(sortState[id]={key:def.key,dir:def.dir});
  const col=cols.find(c=>c.k===st.key)||cols[0];
  return [...rows].sort((a,b)=>{const x=col.val(a),y=col.val(b);const r=typeof x==='string'?x.localeCompare(y):x-y;return st.dir*r||0});
}
function tableHTML(id,cols,rows,def){
  const st=sortState[id]||(sortState[id]={key:def.key,dir:def.dir});
  const body=sortedRows(id,rows,cols,def);
  const head=cols.map(c=>{
    const on=st.key===c.k;
    const arrow=on?(st.dir>0?'▲':'▼'):'';
    return `<th class="${c.l?'l':''}" aria-sort="${on?(st.dir>0?'ascending':'descending'):'none'}"><button data-sort="${id}|${c.k}" title="Sort by ${esc(c.label)}">${c.label}<span aria-hidden="true" style="font-size:9px">${arrow}</span></button></th>`;
  }).join('');
  const trs=body.map((r,i)=>`<tr>${cols.map(c=>`<td class="${c.l?'l ':''}${c.cls||''}">${c.fmt(r,i)}</td>`).join('')}</tr>`).join('');
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

/* ---------- THIS SEASON ---------- */
function seasonPanel(){
  const cur=D.cur;
  const leader=[...cur].sort((a,b)=>a.standing-b.standing)[0];
  const topPts=[...cur].sort((a,b)=>b.pf-a.pf)[0];
  const lucky=[...cur].sort((a,b)=>b.luck-a.luck)[0];
  const unlucky=[...cur].sort((a,b)=>a.luck-b.luck)[0];
  const lede=`<p class="lede"><b>${esc(leader.name)}</b> leads at ${rec(leader.w,leader.l,leader.t)}${topPts.id===leader.id?' and has scored the most points ('+f1(topPts.pf)+')':'; '+esc(topPts.name)+' has scored the most points ('+f1(topPts.pf)+')'}. <b>${esc(lucky.name)}</b> has had the best luck, with ${lucky.w} win${lucky.w===1?'':'s'} from ${f1(lucky.expw)} expected. <b>${esc(unlucky.name)}</b> has had the worst, at ${unlucky.w} win${unlucky.w===1?'':'s'} from ${f1(unlucky.expw)}.</p>`;

  const cols=[
    {k:'standing',label:'#',cls:'rk',val:r=>r.standing,fmt:r=>r.standing},
    {k:'name',label:'Team',l:1,cls:'team',val:r=>r.name,fmt:r=>`<b>${esc(r.name)}</b>${personLine(r.owner)}`},
    {k:'w',label:'Record',val:r=>r.w+r.t/2,fmt:r=>rec(r.w,r.l,r.t)},
    {k:'pf',label:'PF',val:r=>r.pf,fmt:r=>f1(r.pf)},
    {k:'pa',label:'PA',val:r=>r.pa,fmt:r=>f1(r.pa)},
    {k:'ppg',label:'Pts/G',val:r=>r.ppg,fmt:r=>f1(r.ppg)},
    {k:'l3',label:'Last 3',val:r=>r.l3,fmt:r=>{const d=r.l3-r.ppg;return `${f1(r.l3)} <span class="${d>=0?'up':'down'}" title="${sgn(d)} vs season average">${d>=0?'▲':'▼'}</span>`}},
    {k:'power',label:'Power',val:r=>r.powerRank,fmt:r=>`<b>${r.powerRank}</b>`},
    {k:'oppavg',label:'Opp. pts/G',val:r=>r.oppavg,fmt:r=>f1(r.oppavg)},
  ];
  const standings=`<div class="block"><h2>Standings and power rankings</h2>
    <p class="sub">Power rank blends season points per game with the last three weeks. Click a column to sort. Triangles compare the last three weeks with the season average.</p>
    <div id="tbl-cur">${tableHTML('cur',cols,cur,{key:'standing',dir:1})}</div></div>`;

  const maxL=2;
  const luckRows=[...cur].sort((a,b)=>b.luck-a.luck).map(r=>{
    const w=Math.min(Math.abs(r.luck),maxL)/maxL*50;
    const bar=r.luck===0?'':`<div class="bar ${r.luck>0?'p':'n'}" style="width:${w}%"></div>`;
    return `<div class="row"><div class="nm">${esc(r.name)}${personLine(r.owner)}</div><div class="tr" title="${esc(r.name)}: ${rec(r.w,r.l,r.t)} actual, ${f1(r.expw)} expected">${bar}</div><div class="vl"><b class="${r.luck>0?'up':r.luck<0?'down':''}">${sgn(r.luck,1)}</b> <span class="dim">${r.w} vs ${f1(r.expw)}</span></div></div>`;
  }).join('');
  const luck=`<div class="block"><h2>Luck</h2>
    <p class="sub">Expected wins come from playing every other team each week (all-play record). Bars show actual wins minus expected wins, so a bar to the right means the schedule has helped.</p>
    <div class="luck">${luckRows}<div class="axis"><span>−2 wins</span><span>0</span><span>+2 wins</span></div></div>
    <div class="key"><span><i class="sw" style="background:var(--pos)"></i>More wins than expected</span><span><i class="sw" style="background:var(--neg)"></i>Fewer wins than expected</span></div></div>`;

  const lo=Math.min(...cur.flatMap(t=>t.scores)), hi=Math.max(...cur.flatMap(t=>t.scores));
  const hr=[...cur].sort((a,b)=>a.standing-b.standing).map(r=>{
    const cells=r.scores.map((s,i)=>`<td class="c" style="--i:${((s-lo)/(hi-lo)).toFixed(3)}" title="Week ${i+1}: ${f2(s)}">${f1(s)}</td>`).join('');
    return `<tr><td class="l team"><b>${esc(r.name)}</b>${personLine(r.owner)}</td>${cells}<td><b>${f1(r.ppg)}</b></td><td class="dim">±${r.sd}</td></tr>`;
  }).join('');
  const heads=Array.from({length:NW},(_,i)=>`<th style="text-align:center">Wk ${i+1}</th>`).join('');
  const avgRow=`<tr class="avg"><td class="l">League average</td>${D.weekAvg.map(a=>`<td style="text-align:center">${f1(a)}</td>`).join('')}<td>${f1(D.weekAvg.reduce((a,b)=>a+b,0)/NW)}</td><td></td></tr>`;
  const grid=`<div class="block"><h2>Weekly scores</h2>
    <p class="sub">Darker cells are bigger weeks. The last column is the spread of a team's weekly scores (standard deviation), a rough sense of how boom-or-bust it is.</p>
    <div class="scroll"><table class="heat"><thead><tr><th class="l">Team</th>${heads}<th>Avg</th><th>Spread</th></tr></thead><tbody>${hr}${avgRow}</tbody></table></div></div>`;

  const pr=[...cur].sort((a,b)=>b.projW-a.projW).map(r=>{
    const left=r.projLo/14*100, width=Math.max((r.projHi-r.projLo)/14*100,2);
    return `<div class="row"><div class="nm">${esc(r.name)}${personLine(r.owner)}</div><div class="tr" title="${esc(r.name)}: projected ${f1(r.projW)} wins (10th–90th percentile ${r.projLo}–${r.projHi}); ${r.w} now"><div class="band" style="left:${left}%;width:${width}%"></div><div class="now" style="left:${(r.w+r.t/2)/14*100}%"></div><div class="dot" style="left:${r.projW/14*100}%"></div></div><div class="vl"><b>${f1(r.projW)}</b></div></div>`;
  }).join('');
  const axis=[0,7,14].map(n=>`<span style="left:${n/14*100}%">${n}</span>`).join('');
  const proj=`<div class="block"><h2>Projected final wins</h2>
    <p class="sub">8,000 simulations of weeks ${NW+1}–14 using each team's scoring average (pulled toward the league average early in the season) and the real remaining schedule.</p>
    <div class="proj">${pr}<div class="axis">${axis}</div></div>
    <div class="key"><span><i class="sw" style="background:var(--accent);border-radius:50%"></i>Projected wins</span><span><i class="sw" style="background:var(--heat);opacity:.5"></i>Middle 80% of outcomes</span><span><i class="sw" style="background:var(--ink);width:3px"></i>Wins today</span></div></div>`;

  return lede+standings+luck+grid+proj;
}

/* ---------- HISTORY ---------- */
function historyPanel(){
  const maxPct=Math.max(...D.alltime.map(r=>r.pct));
  const cols=[
    {k:'name',label:'Team',l:1,cls:'team',val:r=>r.name,fmt:r=>`<b>${esc(r.name)}</b>${personLine(r.owner)}`},
    {k:'seasons',label:'Seasons',val:r=>r.seasons.length,fmt:r=>r.seasons.length>1?`${r.seasons[0]}–${String(r.seasons[r.seasons.length-1]).slice(2)}`:r.seasons[0]},
    {k:'w',label:'Record',val:r=>r.pct,fmt:r=>rec(r.w,r.l,r.t)},
    {k:'pct',label:'Win %',cls:'barcell',val:r=>r.pct,fmt:r=>`<i style="width:${(r.pct/maxPct*100).toFixed(0)}%"></i><span>${(r.pct*100).toFixed(1)}%</span>`},
    {k:'ppg',label:'Pts/G',val:r=>r.ppg,fmt:r=>f1(r.ppg)},
    {k:'pf',label:'PF',val:r=>r.pf,fmt:r=>Math.round(r.pf).toLocaleString()},
    {k:'top',label:'Top seeds',val:r=>r.top,fmt:r=>r.top||'<span class="dim">–</span>'},
    {k:'best',label:'Best finish',val:r=>r.best,fmt:r=>`#${r.best}`},
  ];
  const all=`<div class="block"><h2>All-time regular season</h2>
    <p class="sub">Owner by owner, 2021 through week ${NW} of 2026. Jordan (2021\u201322) and Chris (2023\u201326) each ran team 10, so they appear as separate rows. Top seed means first in the regular-season standings (wins, then points).</p>
    ${'<div id="tbl-all">'+tableHTML('all',cols,D.alltime,{key:'pct',dir:-1})+'</div>'}</div>`;

  const years=[2021,2022,2023,2024,2025,2026];
  const order=D.alltime.map(r=>r.owner);
  const rows=order.map(o=>{

      return `<td class="r" style="--i:${i}" title="${esc(c.team)}, ${y}: ${rec(c.w,c.l,c.t)}, ${f1(c.pf)} points"><b>${c.rank}</b><small>${rec(c.w,c.l,c.t)}</small></td>`;
    }).join('');

  }).join('');
  const rk=`<div class="block"><h2>Finish by season</h2>

    <div class="scroll"><table class="ranks"><thead><tr><th class="l">Team</th>${years.map(y=>`<th style="text-align:center">${y}${y===2026?'*':''}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;

/* ---------- OPTIMAL LINEUPS ---------- */
function optimalSection(){
  const O=D.opt, pc=x=>(x*100).toFixed(1)+'%';
  const rows=O.owners;
  const byEff=[...rows].sort((a,b)=>b.eff-a.eff)[0];
  const byPerfect=[...rows].sort((a,b)=>b.perfect-a.perfect||b.eff-a.eff)[0];
  const lede=`<p class="lede"><b>${esc(nameOf(byEff.owner))}</b> (${esc(who(byEff.owner))}) got the most out of their rosters, scoring ${pc(byEff.eff)} of the best possible lineup. <b>${esc(nameOf(byPerfect.owner))}</b> (${esc(who(byPerfect.owner))}) set a perfect lineup most often, ${byPerfect.perfect} times in ${byPerfect.weeks} weeks. The whole league averaged ${pc(O.leagueEff)}, and a perfect lineup happened ${O.perfect.length} times in ${O.n} team-weeks.</p>`;
  const lo=Math.min(...rows.map(r=>r.eff)), hi=Math.max(...rows.map(r=>r.eff));
  const cols=[
    {k:'name',label:'Team',l:1,cls:'team',val:r=>nameOf(r.owner),fmt:r=>`<b>${esc(nameOf(r.owner))}</b>${personLine(r.owner)}`},
    {k:'eff',label:'Efficiency',cls:'barcell',val:r=>r.eff,fmt:r=>`<i style="width:${(((r.eff-(lo-0.02))/(hi-(lo-0.02)))*100).toFixed(0)}%"></i><span><b>${pc(r.eff)}</b></span>`},
    {k:'perfect',label:'Perfect weeks',val:r=>r.perfect,fmt:r=>`${r.perfect} <span class="dim">of ${r.weeks}</span>`},
    {k:'actual',label:'Scored',val:r=>r.actual,fmt:r=>Math.round(r.actual).toLocaleString()},
    {k:'optimal',label:'Possible',val:r=>r.optimal,fmt:r=>Math.round(r.optimal).toLocaleString()},
    {k:'left',label:'Left on bench',val:r=>r.left,fmt:r=>Math.round(r.left).toLocaleString()},
    {k:'avgLeft',label:'Per week',val:r=>r.avgLeft,fmt:r=>f1(r.avgLeft)},
    {k:'worst',label:'Worst miss',val:r=>r.worst.gap,fmt:r=>`${f1(r.worst.gap)} <span class="dim">${r.worst.y} Wk ${r.worst.wk}</span>`},
  ];
  const table=`<div id="tbl-opt">${tableHTML('opt',cols,rows,{key:'eff',dir:-1})}</div>`;
  const years=[2021,2022,2023,2024,2025,2026];
  const all=rows.flatMap(r=>Object.values(r.bySeason)); const slo=Math.min(...all), shi=Math.max(...all);
  const order=[...rows].sort((a,b)=>b.eff-a.eff);
  const grid=order.map(r=>{
    const cells=years.map(y=>{
      const e=r.bySeason[y];
      if(e==null) return `<td class="r none">\u2013</td>`;
      return `<td class="r" style="--i:${((e-slo)/(shi-slo)).toFixed(3)}" title="${esc(nameOf(r.owner))}, ${y}: ${pc(e)} of the best possible lineup"><b style="font-size:17px">${pc(e)}</b></td>`;
    }).join('');
    return `<tr><td class="l team"><b>${esc(nameOf(r.owner))}</b>${personLine(r.owner)}</td>${cells}</tr>`;
  }).join('');
  const season=`<div class="scroll"><table class="ranks"><thead><tr><th class="l">Team</th>${years.map(y=>`<th style="text-align:center">${y}${y===2026?'*':''}</th>`).join('')}</tr></thead><tbody>${grid}</tbody></table></div>`;
  const miss=O.misses.map(g=>`<li><span class="when">${g.y} Wk ${g.wk}</span><span class="who"><b>${esc(nameOf(g.owner))}</b> (${esc(who(g.owner))})<small>${f1(g.actual)} scored, ${f1(g.optimal)} possible</small></span><span class="num">${f1(g.gap)}</span></li>`).join('');
  return `<div class="block"><h2>Optimal lineups</h2>
    <p class="sub">Each week's best legal lineup from the full roster: 1 QB, 2 RB, 2 WR, 1 TE, 1 FLEX, 1 D/ST and 1 K, leaving out players on IR. Efficiency is points scored divided by points possible. ${O.n} team-weeks across 2021\u20132026, with 2026 through week ${NW}.</p>
    ${lede}</div>
  <div class="block">${table}</div>
  <div class="block"><h2>Efficiency by season</h2><p class="sub">Darker cells are seasons closer to the best possible lineup.</p>${season}</div>
  <div class="block"><h2>Biggest lineup misses</h2><p class="sub">The weeks with the most points left on the bench, in points.</p><div class="recs"><ol>${miss}</ol></div></div>`;
}

/* ---------- LEAGUE RULES ---------- */
/* Punishment photos are embedded as small JPEGs, keyed by season. */
const MEDIA={punish:D.media||{},text:D.mediaText||{}};
function rulesPanel(){
  const R=D.rules, P=R.pred, pc=x=>Math.round(x*100)+'%';
  const usd=n=>(n<0?'−':n>0?'+':'')+'$'+Math.abs(n).toLocaleString();
  const bills=Array.from({length:R.teams},()=>`<div class="bill">$${R.buyIn}</div>`).join('');
  const lede=`<p class="lede">Everyone buys in for <b>$${R.buyIn}</b>. The champion takes the pot except for the runner-up's buy-in, which goes back to second place.</p>`;
  const money=`<div class="block"><h2>The money</h2>
    <div class="money">
      <div><div class="m-label">${R.teams} teams pay in</div><div class="bills">${bills}</div><div class="m-cap">$${R.buyIn} a head</div></div>
      <div class="m-arrow" aria-hidden="true">→</div>
      <div><div class="m-label">The pot</div><div class="potbox">$${R.pot}</div></div>
      <div class="m-arrow" aria-hidden="true">→</div>
      <div class="pays"><div class="pay first"><b>$${R.first}</b><span>Champion takes the rest</span></div><div class="pay second"><b>$${R.second}</b><span>Runner-up gets their buy-in back</span></div></div>
    </div>
    <div class="splitbar" role="img" aria-label="Of the $${R.pot} pot, $${R.first} goes to the champion and $${R.second} to the runner-up"><i class="a" style="width:${R.first/R.pot*100}%">Champion $${R.first}</i><i class="b" style="width:${R.second/R.pot*100}%">$${R.second}</i></div></div>`;
  const rows=[...R.money].map(m=>`<tr><td class="l team"><b>${esc(nameOf(m.owner))}</b>${personLine(m.owner)}</td><td>${m.seasons}</td><td>$${m.paid}</td><td>$${m.won}</td><td><b class="${m.net>0?'up':m.net<0?'down':''}">${usd(m.net)}</b></td><td class="dim">${m.titles} title${m.titles===1?'':'s'}, ${m.seconds} runner-up${m.seconds===1?'':'s'}</td></tr>`).join('');
  const ledger=`<div class="block"><h2>Money won so far</h2><p class="sub">2021 through 2025, assuming the same $${R.buyIn} buy-in and payout every year. Net is winnings minus buy-ins. 2026 is not settled yet.</p>
    <div class="scroll"><table><thead><tr><th class="l">Team</th><th>Seasons</th><th>Paid in</th><th>Won</th><th>Net</th><th>Finishes</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

  const top=P.rows[0], two=P.rows[1];
  const odds=P.rows.map((r,i)=>`<div class="row"><div class="nm">${esc(r.name)}${personLine(r.owner)}</div><div class="tr" title="${esc(r.name)}: ${pc(r.pLast)} chance of finishing last"><div class="bar" style="width:${Math.max(r.pLast/top.pLast*100,r.pLast>0?1.5:0)}%"></div></div><div class="vl">${r.pLast>0&&r.pLast<.005?'<1%':pc(r.pLast)}</div></div>`).join('');
  const punish=`<div class="block"><h2>2026 punishment</h2>
    <div class="punish"><div class="tag">Last place</div><p><b>Play a round of golf in a dress.</b></p><p class="sec">Dodge it, and someone has to draft a defense in the first round.</p></div></div>
  <div class="block"><h2>Dress watch</h2>
    <p class="lede"><b>${esc(top.name)}</b> (${esc(who(top.owner))}) is the early pick to finish last, at ${pc(top.pLast)} of ${P.n.toLocaleString()} simulated finishes. ${esc(two.name)} (${esc(who(two.owner))}) is next at ${pc(two.pLast)}.</p>
    <p class="sub" style="margin-top:8px">Each simulation plays out weeks ${P.weeks+1}–14 on the real schedule using every team's scoring so far, then ranks teams by wins and points scored. After ${P.weeks} weeks this will keep moving.</p>
    <div class="odds">${odds}</div></div>`;

  const cards=R.lastPast.map(p=>{
    const imgs=(MEDIA.punish[p.year]||[]);
    const ph=imgs.length?`<div class="ph ${imgs.length>1?'multi':''}">${imgs.map((src,i)=>`<img src="${src}" alt="${esc(who(p.owner))}'s ${p.year} punishment, photo ${i+1}" loading="lazy" tabindex="0" role="button" data-zoom="1">`).join('')}</div>`:`<div class="ph"><span>No photo yet</span></div>`;
    const txt=MEDIA.text[p.year];
    return `<div class="card">${ph}<div class="cap"><b>${p.year}</b><small>${esc(who(p.owner))} \u00b7 ${esc(p.team)}</small><small>${txt?esc(txt):'Punishment not entered yet'}</small></div></div>`;
  }).join('');
  const past=`<div class="block"><h2>Past punishments</h2><p class="sub">Who took the punishment each season. Tap a photo to enlarge it.</p><div class="gal">${cards}</div></div>`;

  const fmt=`<div class="block"><h2>The basics</h2><ul class="fmt"><li><b>${R.teams} teams</b><span>2026 league size</span></li><li><b>14 weeks</b><span>Regular season</span></li><li><b>1 QB · 2 RB · 2 WR</b><span>Starting lineup</span></li><li><b>1 TE · 1 FLEX</b><span>FLEX is RB, WR or TE</span></li><li><b>1 D/ST · 1 K</b><span>Defense and kicker</span></li></ul></div>`;
  return lede+money+ledger+punish+past+fmt;
}

/* ---------- HEAD TO HEAD ---------- */
function h2hPanel(){
  const order=D.alltime.map(r=>r.owner);
  const map={};D.h2h.forEach(r=>map[r.a+'|'+r.b]=r);
  const head=order.map(o=>`<th class="v" title="${esc(nameOf(o))}"><span>${esc(nameOf(o))}</span></th>`).join('');
  const body=order.map(a=>{
    const cells=order.map(b=>{
      if(a===b) return `<td class="cell self"></td>`;
      const r=map[a+'|'+b];
      if(!r) return `<td class="cell dim">·</td>`;
      const g=r.w+r.l+r.t, share=(r.w+r.t/2)/g, d=(share-.5)*2;
      const col=d>=0?'var(--pos)':'var(--neg)';
      return `<td class="cell" style="background:color-mix(in srgb,${col} ${Math.abs(d)*55}%,var(--surface))" title="${esc(nameOf(a))} vs ${esc(nameOf(b))}: ${rec(r.w,r.l,r.t)}">${r.w}–${r.l}${r.t?'–'+r.t:''}</td>`;
    }).join('');
    return `<tr><td class="rowh">${esc(nameOf(a))}${personLine(a)}</td>${cells}</tr>`;
  }).join('');
  return `<div class="block"><h2>Head to head</h2>
    <p class="sub">Regular-season games from 2021 through week ${NW} of 2026. Read across: the row team's record against the column team. Blue means the row team owns the series, orange means it trails, and a dot means the two never met.</p>
    <div class="scroll"><table class="h2h"><thead><tr><th class="l">Team</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="key"><span><i class="sw" style="background:var(--pos)"></i>Row team leads series</span><span><i class="sw" style="background:var(--neg)"></i>Row team trails series</span></div></div>`;
}

/* ---------- TROPHIES ---------- */
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function trophiesPanel(){
  const years=[2021,2022,2023,2024,2025];
  const F=D.final||{};
  const at=(y,p)=>{const m=F[y]||{};return Object.keys(m).find(k=>m[k]===p)||null};
  const info=(o,y)=>{const t=D.rankTbl.find(r=>r.owner===o);return t&&t.ranks[y]};
  const chips=years.map(y=>{
    const o=at(y,1);
    if(!o) return `<div class="yr empty"><div class="y">${y}</div><div class="c">Champion not entered</div></div>`;
    const t=info(o,y), r=at(y,2), rt=r&&info(r,y);
    return `<div class="yr win"><div class="y">${y} CHAMPION</div><div class="c">${esc(t.team)}</div><div class="p">${esc(who(o))} \u00b7 seed ${t.rank}, ${rec(t.w,t.l,t.t)}</div>${rt?`<div class="p">Runner-up: ${esc(rt.team)} (${esc(who(r))})</div>`:''}</div>`;
  }).join('');
  const finishes=o=>years.map(y=>(F[y]||{})[o]).filter(Boolean);
  const titles=o=>finishes(o).filter(p=>p===1).length;
  const seconds=o=>finishes(o).filter(p=>p===2).length;
  const avg=o=>{const f=finishes(o);return f.length?f.reduce((a,b)=>a+b,0)/f.length:99};
  const order=[...D.alltime].sort((a,b)=>titles(b.owner)-titles(a.owner)||seconds(b.owner)-seconds(a.owner)||avg(a.owner)-avg(b.owner));
  const rows=order.map(a=>{
    const o=a.owner, t=D.rankTbl.find(r=>r.owner===o);
    const cells=years.map(y=>{
      const c=t.ranks[y];
      if(!c) return `<td class="f none">\u2013</td>`;
      const fp=(F[y]||{})[o];
      if(!fp) return `<td class="f seed" title="${esc(c.team)}, ${y}: final place not entered">?</td>`;
      return `<td class="f p${fp<=3?fp:0}" title="${esc(c.team)}, ${y}: finished ${ord(fp)} (regular-season seed ${c.rank})"><b>${ord(fp)}</b><small>${fp===1?'Champion':'Seed '+c.rank}</small></td>`;
    }).join('');
    const n=titles(o), av=avg(o);
    return `<tr><td class="l team"><b>${esc(a.name)}</b>${personLine(o)}</td>${cells}<td class="tot">${n||'<span class="dim">\u2013</span>'}</td><td>${av<99?av.toFixed(1):'\u2013'}</td></tr>`;
  }).join('');
  return `<div class="block"><h2>Champions</h2><p class="sub">Final places come from ESPN's final standings for each season, with the 2022 result set to Jared's title as the league corrected it.</p><div class="years">${chips}</div></div>
  <div class="block"><h2>Final place by season</h2>
    <p class="sub">Where each team ended the year. Small text under a place is the regular-season seed going into the playoffs. Gold-toned cells are the top three. 2026 is still in progress.</p>
    <div class="scroll"><table class="trophy"><thead><tr><th class="l">Team</th>${years.map(y=>`<th style="text-align:center">${y}</th>`).join('')}<th style="text-align:center">Titles</th><th>Avg finish</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- RECORDS ---------- */
function recordsPanel(){

}

/* ---------- NFL banner ---------- */
function renderNfl(){
  const box=document.getElementById('nfl'); if(!box||!D.nfl) return;
  const N=D.nfl, now=Date.now(), H=3600e3;
  const left=ms=>{const m=Math.max(0,Math.round(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;return d?`${d}d ${h}h`:h?`${h}h ${mi}m`:`${mi}m`};
  const games=N.games.filter(g=>now<Date.parse(g.start)+4*H).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start)).slice(0,14);
  const cards=games.map(g=>{
    const t=Date.parse(g.start), live=now>=t;
    const when=`<div class="when"><span>${esc(g.local.replace(/ EDT$/,'').replace(/ [A-Z][a-z]{2} \d+,/,''))}</span><em>${live?'Kicked off':'in '+left(t-now)}</em></div>`;
    const row=(ab,p,fav)=>`<div class="tm ${fav?'fav':''}" title="${esc(N.names[ab]||ab)}"><span>${esc(ab)}</span><small>${p==null?'–':Math.round(p)+'%'}</small></div>`;
    if(g.pa==null) return `<div class="g">${when}${row(g.away,null,false)}${row(g.home,null,false)}<div class="np">Odds not posted yet</div></div>`;
    const af=g.pa>g.ph;
    return `<div class="g" title="${esc((N.names[g.away]||g.away)+' at '+(N.names[g.home]||g.home))}">${when}${row(g.away,g.pa,af)}${row(g.home,g.ph,!af)}<div class="pb" role="img" aria-label="${esc(g.away)} ${Math.round(g.pa)} percent, ${esc(g.home)} ${Math.round(g.ph)} percent"><i class="${af?'f':''}" style="flex:${g.pa}"></i><i class="${af?'':'f'}" style="flex:${g.ph}"></i></div></div>`;
  }).join('');
  box.innerHTML=`<div class="nfl-head"><b>NFL win odds</b><span>Odds as of ${esc(N.asOf)} · away team on top</span></div>`+(cards?`<div class="nfl-strip">${cards}</div>`:`<div class="nfl-empty">No upcoming games in this snapshot. Ask Claude to refresh the odds.</div>`);
}

/* ---------- shell ---------- */
const PANELS={season:seasonPanel,history:historyPanel,h2h:h2hPanel,trophies:trophiesPanel,rules:rulesPanel,records:recordsPanel};
let tab='season';
function show(t){
  tab=PANELS[t]?t:'season';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  document.getElementById('panel').innerHTML=PANELS[tab]();
  document.getElementById('panel').setAttribute('aria-labelledby','t-'+tab);
  try{history.replaceState(null,'','#'+tab)}catch(e){}
}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)show(b.dataset.tab)});
document.getElementById('panel').addEventListener('click',e=>{
  const b=e.target.closest('button[data-sort]');if(!b)return;
  const [id,k]=b.dataset.sort.split('|');const st=sortState[id];
  if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(k==='name'||k==='standing'||k==='best')?1:-1}
  const y=window.scrollY;show(tab);window.scrollTo(0,y);
});
document.getElementById('foot').innerHTML=`<p>Source: ESPN fantasy football data pulled for 2021–2026 (${D.nGames} regular-season games). Weeks 1–14 count as the regular season, and every team's win–loss record was rebuilt from those weekly scores and matches ESPN's own totals. Weeks 15–16 are in the files but are left out of the analytics: the playoff bracket was not part of this pull. Final places on the Trophies tab come from ESPN's final standings.</p><p>Luck, power ranks and projections are estimates calculated from points scored, so treat them as a guide and not a verdict.</p>`;
(function(){const lb=document.getElementById('lb');if(!lb)return;const im=lb.querySelector('img');
  const open=s=>{im.src=s.src;im.alt=s.alt;lb.hidden=false};const close=()=>{lb.hidden=true;im.removeAttribute('src')};
  document.getElementById('panel').addEventListener('click',e=>{const i=e.target.closest('img[data-zoom]');if(i)open(i)});
  document.getElementById('panel').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('img[data-zoom]')){e.preventDefault();open(e.target)}});
  lb.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});})();
renderNfl();
show((location.hash||'').replace('#','')||'season');
</script>
